name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Vitest
        run: npm run test:run
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Cloudflare's official test credentials — the local Supabase stack is
    # configured (config.toml [auth.captcha]) to verify Turnstile tokens with
    # this secret, so auth.setup.ts's dummy token always passes.
    env:
      # Local Supabase fixed dev credentials (identical for every `supabase start`).
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      VITE_CLOUDFLARE_TURNSTILE_SITEKEY: 1x00000000000000000000AA
      CLOUDFLARE_TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      # Must match the password seeded for test@skillswap.test in supabase/seed.sql.
      E2E_TEST_PASSWORD: In*3Fj%HGIy3W3prWUi#HgOU
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: npx supabase start

      - name: Apply migrations and seed
        run: npx supabase db reset

      - name: Build app
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
